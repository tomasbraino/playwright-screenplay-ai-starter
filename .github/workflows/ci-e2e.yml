name: ScreenPlay Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-regression:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Serenity/JS & Playwright Suite
        run: npm test

      - name: Upload Quality Reports (Serenity & Playwright)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            reports/
            target/
          retention-days: 14
